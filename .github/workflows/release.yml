# Tag vX.Y.Z (matching Cargo.toml and plugin/.claude-plugin/plugin.json) to
# build every platform's binary and publish them with SHA256SUMS. The vendor
# job then commits them to main in plugin/libexec/, with plugin/checksums.txt,
# so the plugin ships the new binaries.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, asset: print-to-thermal-darwin-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, asset: print-to-thermal-darwin-x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: print-to-thermal-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: print-to-thermal-linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: print-to-thermal-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --release
        if: "!contains(matrix.target, 'x86_64-apple')"
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          src=target/${{ matrix.target }}/release/print-to-thermal
          [ -f "$src.exe" ] && src="$src.exe"
          mkdir -p dist && cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions match the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"" Cargo.toml
          grep -q "\"version\": \"$v\"" plugin/.claude-plugin/plugin.json
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum print-to-thermal-* > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
  # Bundle the released binaries into the plugin on main (what `make vendor` does).
  vendor:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf plugin/libexec && mkdir -p plugin/libexec
          gh release download "$GITHUB_REF_NAME" --dir plugin/libexec --pattern 'print-to-thermal-*' --pattern SHA256SUMS
          (cd plugin/libexec && sha256sum -c SHA256SUMS)
          printf '# sha256  binary in libexec/ for %s, from the release SHA256SUMS (`make vendor`)\n' "$GITHUB_REF_NAME" > plugin/checksums.txt
          cat plugin/libexec/SHA256SUMS >> plugin/checksums.txt && rm plugin/libexec/SHA256SUMS
          chmod +x plugin/libexec/print-to-thermal-*
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/libexec plugin/checksums.txt
          if git diff --cached --quiet; then echo "already vendored"; exit 0; fi
          git commit -m "Vendor $GITHUB_REF_NAME binaries into the plugin"
          git pull --rebase origin main
          git push origin HEAD:main
