# Releases are cut by a version bump on main, never by pushing a tag by hand:
# `make release VERSION=X.Y.Z` bumps Cargo.toml, plugin.json and the Python
# package and pushes. When main's version has no release yet, this workflow
# tags vX.Y.Z on that commit and publishes release notes. The plugin ships
# its Python source as is, so there is nothing to build or vendor.
name: release
on:
  push:
    branches: [main]
    paths: [Cargo.toml, plugin/.claude-plugin/plugin.json, plugin/thermal/__init__.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Versions agree
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          p=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' plugin/.claude-plugin/plugin.json | head -n 1)
          y=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' plugin/thermal/__init__.py | head -n 1)
          [ "$v" = "$p" ] && [ "$p" = "$y" ] || { echo "::error::Cargo.toml is $v, plugin.json is $p, plugin/thermal/__init__.py is $y; bump all three (make release VERSION=X.Y.Z)"; exit 1; }
          tag="v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            at=$(git rev-parse "$tag^{commit}")
            [ "$at" = "$GITHUB_SHA" ] || { echo "::error::tag $tag already exists at $at, not at this commit $GITHUB_SHA. Tags are created by this workflow; delete the stray one (git push origin :refs/tags/$tag) and re-run."; exit 1; }
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
      - if: steps.v.outputs.release == 'true'
        run: python -m unittest discover -s tests
      # Creates the tag on exactly the commit that was tested.
      - if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
