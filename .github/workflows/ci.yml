name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
  # The plugin's bundled binaries match plugin/checksums.txt, one per platform,
  # and the launcher never fetches anything at run time.
  plugin-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Binaries match checksums.txt
        run: |
          grep -v '^#' plugin/checksums.txt > /tmp/sums
          (cd plugin/libexec && sha256sum -c /tmp/sums)
          listed=$(awk '{print $2}' /tmp/sums | sort)
          present=$(ls plugin/libexec | sort)
          [ "$listed" = "$present" ] || { echo "libexec/ and checksums.txt list different files"; exit 1; }
      - name: Launcher runs the bundled binary
        run: |
          ! grep -nE 'curl|wget' plugin/bin/print-to-thermal
          plugin/bin/print-to-thermal --help | head -n 1
