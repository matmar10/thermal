name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # The plugin's Python package, on the oldest and newest supported Pythons
  # and on every OS it runs on.
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  # The Rust reference build, and the Python package checked against it.
  rust-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo test --release
      - run: python tests/parity.py target/release/print-to-thermal
  # The launcher runs the bundled package and never fetches anything.
  plugin-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launcher runs the package
        run: |
          ! grep -nE 'curl|wget|pip install' plugin/bin/print-to-thermal plugin/bin/print-to-thermal.cmd
          plugin/bin/print-to-thermal --help | head -n 1
      - name: No compiled files in the plugin
        run: |
          ! find plugin -type d -name __pycache__ | grep .
          ! find plugin -type f \( -name '*.pyc' -o -name '*.so' -o -name '*.exe' -o -name '*.dll' \) | grep .
